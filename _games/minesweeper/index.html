<link rel="stylesheet" href="minesweeper.css" />

<section class="minesweeper" data-minesweeper>
    <div class="minesweeper_controls">
        <button type="button" data-level="beginner">Beginner</button>
        <button type="button" data-level="intermediate">Intermediate</button>
        <button type="button" data-level="expert">Expert</button>
    </div>

    <div class="minesweeper_panel">
        <div class="minesweeper_status">
            <span class="minesweeper_counter" aria-label="Mines remaining">000</span>
            <button type="button" class="minesweeper_reset" data-reset aria-label="New game">:-)</button>
            <span class="minesweeper_counter" data-timer aria-label="Elapsed time">000</span>
        </div>
        <div class="minesweeper_board" data-board role="grid" aria-label="Minesweeper board"></div>
    </div>

    <p class="minesweeper_message" data-message role="status" aria-live="polite"></p>
</section>
