---
layout: default
title: "Calculator"
permalink: /games/calculator/
icon: "/games/calculator/calculator.icon.png"
command: "calc"
---

<link rel="stylesheet" href="css/HistrixCalculator.css" type="text/css" />

<div class="calculator" data-calculator>
    <div class="calculator_header">
        <img src="calculator.icon.png" alt="Calculator" width="32" height="32" />
        <span>Calculator</span>
        <label class="sr-only" for="calculator_mode">Calculator mode</label>
        <select id="calculator_mode" data-mode>
            <option value="standard">Standard</option>
            <option value="scientific">Scientific</option>
        </select>
    </div>
    <label class="sr-only" for="calculator_display">Calculator display</label>
    <input id="calculator_display" class="calculator_display" data-display value="0" readonly />
    <div class="calculator_keys" data-keys>
        <button type="button" data-action="clear">Clear</button>
        <button type="button" data-action="backspace">Backspace</button>
        <button type="button" data-value="/">/</button>
        <button type="button" data-value="*">*</button>
        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button type="button" data-value="-">-</button>
        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button type="button" data-value="+">+</button>
        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-action="equals">=</button>
        <button type="button" data-value="0">0</button>
        <button type="button" data-value=".">.</button>
        <button type="button" data-action="negate">+/-</button>
        <button type="button" class="scientific_key" data-action="sqrt">sqrt</button>
        <button type="button" class="scientific_key" data-action="sin">sin</button>
        <button type="button" class="scientific_key" data-action="cos">cos</button>
        <button type="button" class="scientific_key" data-action="tan">tan</button>
    </div>
</div>

<script src="js/app.js"></script>
