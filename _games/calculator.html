---
layout: default
title: "Calculator"
icon: "/games/calculator/icon/histrix.png"
command: "calc"
---

<link rel="stylesheet" href="calculator/css/HistrixCalculator.css" type="text/css"/>

<script type="text/javascript" src="calculator/js/HistrixCalculator.js"></script>
<script type="text/javascript" src="calculator/js/HistrixCalculator.handlers.js"></script>
<script type="text/javascript" src="calculator/js/HistrixCalculator.math.js"></script>
<script type="text/javascript" src="calculator/js/HistrixCalculator.display.js"></script>
<script type="text/javascript" src="calculator/js/Init.js"></script>

<form action="" method="post">
    <div id="HistrixCalculator">
        <!-- Title -->
        <div class="header">
            <div class="help">
                <img src="calculator/icon/histrix.png" alt="" title="Histrix Calculator"/>
            </div>
            Histrix
            <div class="mode">
                <label for="calc-mode" class="sr-only">Calculator mode</label>
                <select id="calc-mode" name="mode">
                    <option value="standard">Standard</option>
                    <option value="scientific">Scientific</option>
                </select>
            </div>
        </div>

        <!-- Display -->
        <div class="up">
            <label for="calc-display" class="sr-only">Calculator display</label>
            <input id="calc-display" type="text" name="display" value="" readonly="readonly" class="display"/>
        </div>

        <!-- Bases -->
        <div class="up scientific">
            <div class="left_side">
                <label><input id="base-hex" type="radio" name="base" value="hexadecimal"/><span class="label">Hex &nbsp;</span></label>
                <label><input id="base-dec" type="radio" name="base" value="decimal" checked="checked"/><span class="label">Dec &nbsp;</span></label>
                <label><input id="base-oct" type="radio" name="base" value="octal"/><span class="label">Oct &nbsp;</span></label>
                <label><input id="base-bin" type="radio" name="base" value="binary"/><span class="label">Bin</span></label>
            </div>

            <div class="right_side">
                <span class="decimal">
                    <label><input id="metric-deg" type="radio" name="metric" value="degrees"/><span class="label">Degrees &nbsp;</span></label>
                    <label><input id="metric-rad" type="radio" name="metric" value="radians" checked="checked"/><span class="label">Radians &nbsp;</span></label>
                    <label><input id="metric-grad" type="radio" name="metric" value="grads"/><span class="label">Grads</span></label>
                </span>
                <span class="hexadecimal octal binary">
                    <label><input id="range-qword" type="radio" name="range" value="qword" checked="checked"/><span class="label">Qword &nbsp;</span></label>
                    <label><input id="range-dword" type="radio" name="range" value="dword"/><span class="label">Dword &nbsp;</span></label>
                    <label><input id="range-word" type="radio" name="range" value="word"/><span class="label">Word &nbsp;</span></label>
                    <label><input id="range-byte" type="radio" name="range" value="byte"/><span class="label">Byte</span></label>
                </span>
            </div>
        </div>

        <div class="down">
            <!-- Right-side buttons -->
            <div class="right">
                <div class="left_column">
                    <label for="calc-mem" class="sr-only">Memory register</label>
                    <span class="square read_only"><input id="calc-mem" type="text" name="mem" readonly="readonly"/></span>
                    <button type="button" class="button square red">MC</button>
                    <button type="button" class="button square red">MR</button>
                    <button type="button" class="button square red">MS</button>
                    <button type="button" class="button square red">M+</button>
                    <span class="scientific"><button type="button" class="button square blue decimal">pi</button></span>
                </div>

                <button type="button" class="button rectangle red">Backspace</button>
                <button type="button" class="button rectangle red">CE</button>
                <button type="button" class="button rectangle red scientific">CA</button>
                <button type="button" class="button square red standard">CA</button>

                <button type="button" class="button square blue hexadecimal decimal octal">7</button>
                <button type="button" class="button square blue hexadecimal decimal">8</button>
                <button type="button" class="button square blue hexadecimal decimal">9</button>
                <button type="button" class="button square red">/</button>
                <button type="button" class="button square red scientific">Mod</button>
                <button type="button" class="button square red scientific">And</button>
                <button type="button" class="button square blue standard">sqrt</button>

                <button type="button" class="button square blue hexadecimal decimal octal">4</button>
                <button type="button" class="button square blue hexadecimal decimal octal">5</button>
                <button type="button" class="button square blue hexadecimal decimal octal">6</button>
                <button type="button" class="button square red">*</button>
                <button type="button" class="button square red scientific">Or</button>
                <button type="button" class="button square red scientific">Xor</button>
                <button type="button" class="button square blue standard">%</button>

                <button type="button" class="button square blue">1</button>
                <button type="button" class="button square blue hexadecimal decimal octal">2</button>
                <button type="button" class="button square blue hexadecimal decimal octal">3</button>
                <button type="button" class="button square red">-</button>
                <button type="button" class="button square red scientific">Lsh</button>
                <button type="button" class="button square red scientific">Not</button>
                <button type="button" class="button square blue standard">1/x</button>

                <button type="button" class="button square blue">0</button>
                <button type="button" class="button square blue">+/-</button>
                <button type="button" class="button square blue decimal">.</button>
                <button type="button" class="button square red">+</button>
                <button type="button" class="button square red">=</button>
                <button type="button" class="button square red scientific">Int</button>

                <button type="button" class="button square fuchsia scientific hexadecimal">A</button>
                <button type="button" class="button square fuchsia scientific hexadecimal">B</button>
                <button type="button" class="button square fuchsia scientific hexadecimal">C</button>
                <button type="button" class="button square fuchsia scientific hexadecimal">D</button>
                <button type="button" class="button square fuchsia scientific hexadecimal">E</button>
                <button type="button" class="button square fuchsia scientific hexadecimal">F</button>

                <div style="clear:both"></div>
            </div>
            
            <!-- Left-side buttons -->
            <div class="left scientific">

                <div class="row">
                    <div class="inv_hyp_column">
                        <label for="calc-inv"><input id="calc-inv" type="checkbox" name="inv" value="inv"/> <span class="label">Inv</span></label>
                        &nbsp;&nbsp;
                        <label for="calc-hyp"><input id="calc-hyp" type="checkbox" name="hyp" value="hyp"/> <span class="label">Hyp</span></label>
                    </div>

                    <label for="calc-par" class="sr-only">Parameter display</label>
                    <span class="square read_only"><input id="calc-par" type="text" name="par" readonly="readonly"/></span>

                    <div style="clear:both"></div>
                </div>
                    

                <div class="left_column">
                    <button type="button" class="button square blue">Sta</button>
                    <button type="button" class="button square blue stadistic">Ave</button>
                    <button type="button" class="button square blue stadistic">Sum</button>
                    <button type="button" class="button square blue stadistic">s</button>
                    <button type="button" class="button square blue stadistic">Dat</button>
                </div>

                <button type="button" class="button square fuchsia decimal">F-E</button>
                <button type="button" class="button square fuchsia">(</button>
                <button type="button" class="button square fuchsia">)</button>

                <button type="button" class="button square fuchsia decimal">dms</button>
                <button type="button" class="button square fuchsia decimal">Exp</button>
                <button type="button" class="button square fuchsia">ln</button>

                <button type="button" class="button square fuchsia decimal">sin</button>
                <button type="button" class="button square fuchsia">x^y</button>
                <button type="button" class="button square fuchsia">log</button>

                <button type="button" class="button square fuchsia decimal">cos</button>
                <button type="button" class="button square fuchsia">x^3</button>
                <button type="button" class="button square fuchsia">n!</button>

                <button type="button" class="button square fuchsia decimal">tan</button>
                <button type="button" class="button square fuchsia">x^2</button>
                <button type="button" class="button square fuchsia">1/x</button>

                <div style="clear:both"></div>
            </div>

            <div style="clear:both"></div>
        </div>

        <div id="HistrixCalculator_stadistics">
            <div>
                <label for="calc-datos" class="sr-only">Calculator stored values</label>
                <select id="calc-datos" name="datos" multiple="multiple" size="4" style="width:100%;">

                </select>
            </div>
            <div>
                <button name="ret" class="">Ret</button>
                <button name="load" class="">Load</button>
                <button name="cd" class="">CD</button>
                <button name="cad" class="">CAD</button>
            </div>
        </div>
    </div>
</form>
