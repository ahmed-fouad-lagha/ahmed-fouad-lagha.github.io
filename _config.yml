url: "https://ahmed-fouad-lagha.github.io"
baseurl: ""

incremental: true

plugins:
    -
        jekyll-sitemap

# variables
name: Ahmed Fouad Lagha's homepage
description: Ahmed Fouad Lagha's homepage
google_verification: null


# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE", "TODO.txt", "Gemfile", "Gemfile.lock"]

# Sass
sass:
    style: :compressed
    sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:
    input: GFM
    
# Collections
collections:
    bio:
        output: true
        name: Biography
        pos: 1
    honors:
        output: true
        name: Honors
        pos: 2
    publications:
        output: true
        name: Publications
        pos: 3
    cv:
        output: true
        name: CV
        pos: 4
    blogs:
        output: true
        name: Blogs
        pos: 5
    games:
        output: true
        name: Games
        pos: 6
    teaching:
        output: true
        name: Teaching
        pos: 100
    
defaults:
    -
        scope:
            path: ""
        values:
            icon: "/assets/img/file.ico"
