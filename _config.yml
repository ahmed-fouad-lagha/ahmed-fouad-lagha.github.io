url: "https://ahmed-fouad-lagha.github.io"
baseurl: ""

plugins:
    - jekyll-sitemap

# variables
name: Ahmed Fouad Lagha's homepage
description: Homepage of Ahmed Fouad Lagha, PhD candidate at Eotvos Lorand University working on synthetic data generation, privacy-preserving machine learning, and trustworthy AI.
# File management
exclude: ["README.md", "LICENSE", "Gemfile", "Gemfile.lock"]

# Sass
sass:
    style: :compressed
    sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:

# Collections
collections:
    cv:
        output: true
        name: CV
        pos: 4
    blogs:
        output: true
        name: Blogs
        pos: 5
    games:
        output: true
        name: Games
        pos: 6
    
defaults:
    -
        scope:
            path: ""
        values:
            icon: "/assets/img/file.ico"
